<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · KA Rénovation</title>
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fond: #f7f4ef; --pierre: #ebe5dc; --sable: #d9d0c3; --encre: #1b1a18; --gris: #6d675f; --clair: #a39b90; --blanc: #fff; --filet: #c8141a; --ok: #2f6f4f; --att: #9a6b12;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--sans); background: var(--fond); color: var(--encre); font-size: 15px; line-height: 1.5; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; }
  .petit { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
  .gris { color: var(--gris); }

  /* Structure */
  .haut { position: sticky; top: 0; z-index: 30; background: rgba(247,244,239,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,.06); }
  .haut .in { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 16px; max-width: 1100px; margin: 0 auto; }
  .haut img { height: 28px; }
  .haut .mode { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: #fff3d6; color: var(--att); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 40px; }
  .entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

  nav.bas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(255,255,255,.97); backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,.08); display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav.bas a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 8px; text-decoration: none; font-size: 11px; color: var(--clair); }
  nav.bas a svg { width: 22px; height: 22px; }
  nav.bas a.actif { color: var(--encre); }
  nav.bas a { position: relative; }
  .compte-nav { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--filet); color: #fff; font-size: 10px; font-weight: 600; line-height: 17px; text-align: center; }
  .alerte { display: flex; align-items: center; gap: 14px; background: #fff; border-left: 3px solid var(--filet); border-radius: 14px; padding: 14px 16px; margin-bottom: 22px; text-decoration: none; }
  .alerte svg { width: 26px; height: 26px; flex: none; }
  .alerte span:nth-child(2) { flex: 1; }
  .alerte small { display: block; color: var(--gris); }
  .photos-demande { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .photos-demande img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
  .signe-ok { margin-bottom: 12px; background: #e3f0e8; color: var(--ok); }
  .signe-ok small { display: block; }

  /* Éléments */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 999px; border: 1px solid transparent; background: var(--encre); color: #fff; font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn svg { width: 17px; height: 17px; }
  .btn.clair { background: #fff; color: var(--encre); border-color: var(--sable); }
  .btn.discret { background: transparent; color: var(--encre); border-color: var(--sable); }
  .btn.danger { background: transparent; color: #a3261f; border-color: #e7c3c0; }
  .btn.petit-btn { padding: 8px 13px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .carte { background: var(--blanc); border-radius: 16px; padding: 18px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.04); }
  .grille { display: grid; gap: 12px; }
  .liste { display: grid; gap: 8px; }
  .ligne-liste { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border-radius: 14px; padding: 14px 16px; text-decoration: none; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  .ligne-liste b { display: block; font-weight: 600; }
  .ligne-liste small { color: var(--gris); }
  .ligne-liste .droite { text-align: right; flex: none; }
  .montant { font-family: var(--serif); font-size: 18px; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--pierre); color: var(--gris); text-transform: capitalize; }
  .badge.envoye { background: #e9eef6; color: #2c4f80; }
  .badge.signe, .badge.paye { background: #e3f0e8; color: var(--ok); }
  .badge.annule, .badge.refuse { background: #f6e5e4; color: #a3261f; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: #fff; border-radius: 16px; padding: 16px; }
  .stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: 26px; margin-top: 4px; }
  .raccourcis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .raccourcis a { display: flex; flex-direction: column; gap: 10px; background: var(--encre); color: #fff; border-radius: 16px; padding: 16px; text-decoration: none; font-weight: 500; }
  .raccourcis a:nth-child(n+2) { background: #fff; color: var(--encre); }
  .raccourcis svg { width: 24px; height: 24px; }
  .recherche { width: 100%; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--sable); background: #fff; margin-bottom: 14px; }
  .onglets { display: inline-flex; background: var(--pierre); padding: 4px; border-radius: 999px; margin-bottom: 14px; }
  .onglets a { padding: 7px 16px; border-radius: 999px; text-decoration: none; font-size: 14px; color: var(--gris); }
  .onglets a.actif { background: #fff; color: var(--encre); font-weight: 500; }
  .vide { text-align: center; color: var(--gris); padding: 40px 10px; }

  /* Formulaires */
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); margin-bottom: 5px; }
  .champ { margin-bottom: 12px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--sable); border-radius: 10px; background: #fff; font-size: 16px; }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--encre); outline-offset: -1px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trois { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  fieldset { border: 0; margin-bottom: 18px; }
  legend { font-family: var(--serif); font-size: 19px; margin-bottom: 12px; }

  /* Éditeur de document */
  .lot { background: #fff; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .lot-tete { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; background: var(--pierre); }
  .lot-tete input { background: transparent; border: 0; font-weight: 600; padding: 6px 4px; font-size: 16px; }
  .lot-tete .st { font-family: var(--serif); white-space: nowrap; }
  .ligne-doc { padding: 12px 14px; border-top: 1px solid var(--pierre); display: grid; gap: 8px; }
  .ligne-doc .chiffres { display: grid; grid-template-columns: 1fr 1fr 1.2fr auto; gap: 8px; align-items: end; }
  .ligne-doc .tot { font-family: var(--serif); text-align: right; padding-bottom: 10px; white-space: nowrap; }
  .icone { background: transparent; border: 0; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gris); }
  .icone:hover { background: var(--pierre); }
  .icone svg { width: 18px; height: 18px; }
  .lot-pied { display: flex; gap: 8px; padding: 10px 14px 14px; flex-wrap: wrap; }
  .barre-total { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 20; background: var(--encre); color: #fff; border-radius: 16px; padding: 12px 14px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .barre-total .montant { font-size: 22px; }
  .barre-total small { color: #bdb6ac; display: block; font-size: 12px; }
  .photos-pv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photos-pv div { position: relative; }
  .photos-pv img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
  .photos-pv .icone { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); width: 30px; height: 30px; }
  .pad-signature { width: 100%; height: 200px; background: #fff; border: 1px dashed var(--sable); border-radius: 12px; touch-action: none; display: block; }
  .vignette { position: relative; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
  .vignette img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: var(--sable); }
  .vignette span { position: absolute; left: 6px; bottom: 6px; background: rgba(20,19,18,.7); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 99px; }
  .note-carnet { position: relative; background: #fff; border-radius: 12px; padding: 10px 40px 10px 12px; margin-top: 8px; }
  .note-carnet small { color: var(--gris); font-size: 12px; }
  .note-carnet .icone { position: absolute; top: 6px; right: 6px; }
  .pointage { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid var(--sable); }
  .pointage small { display: block; color: var(--gris); font-size: 13px; }
  .pointage.actif { background: #e3f0e8; border-color: #b9d6c4; }
  .note-carnet.heures p b { font-family: var(--serif); font-weight: 400; font-size: 18px; }
  @media (min-width: 700px) { .resume-carnet { grid-template-columns: repeat(4, 1fr) !important; } }
  .resume-carnet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  .resume-carnet button { background: #fff; border: 1px solid var(--sable); border-radius: 12px; padding: 10px; text-align: left; font: inherit; font-size: 12px; color: var(--gris); cursor: pointer; }
  .resume-carnet b { display: block; font-family: var(--serif); font-weight: 400; font-size: 20px; color: var(--encre); }
  .note-carnet.imprevu { border-left: 4px solid #c8141a; }
  .note-carnet.depense p b { font-family: var(--serif); font-weight: 400; font-size: 18px; }
  .note-carnet.tache label { display: flex; gap: 10px; align-items: flex-start; text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 400; color: var(--encre); margin: 0; }
  .note-carnet.tache input { width: 22px; height: 22px; flex: none; accent-color: var(--encre); }
  .note-carnet.faite span { text-decoration: line-through; color: var(--gris); }
  .ligne-bilan { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--pierre); font-size: 14px; }
  .ligne-bilan.total { font-weight: 600; border-top-color: var(--sable); }
  .ligne-bilan span:first-child { flex: 1; min-width: 0; }
  .ligne-bilan a { color: inherit; }
  .barre-dep { display: block; height: 4px; background: var(--encre); opacity: .18; border-radius: 4px; margin-top: 4px; }
  .cat-dep summary { list-style: none; cursor: pointer; }
  .cat-dep summary::-webkit-details-marker { display: none; }
  .ligne-bilan.sous { font-size: 13px; color: var(--gris); padding-left: 12px; border-top-style: dashed; }
  .etapes-install { padding-left: 20px; margin-bottom: 12px; line-height: 1.7; }
  .reste-carnet { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: #e3f0e8; border: 1px solid #b9d6c4; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font: inherit; color: var(--encre); cursor: pointer; }
  .reste-carnet small { display: block; color: var(--gris); font-size: 12px; }
  .reste-carnet b { font-family: var(--serif); font-weight: 400; font-size: 22px; white-space: nowrap; }
  .lien-ticket { background: none; border: 0; padding: 0; color: var(--gris); text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; }
  .vignette em { position: absolute; left: 6px; right: 6px; top: 6px; background: rgba(255,255,255,.88); color: var(--encre); font-style: normal; font-size: 11px; padding: 2px 7px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-ligne { font-size: 13px; color: var(--gris); margin-top: 6px; }
  .actions-doc { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }

  /* Fenêtre */
  .voile { position: fixed; inset: 0; z-index: 60; background: rgba(20,19,18,.5); display: flex; align-items: flex-end; justify-content: center; }
  .fenetre { background: var(--fond); width: 100%; max-width: 620px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .fenetre .tete { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cat-titre { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); margin: 16px 0 6px; }
  .groupe-ajout { border-bottom: 1px solid var(--sable); }
  .groupe-ajout summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; font-weight: 600; font-size: 15px; }
  .groupe-ajout summary::-webkit-details-marker { display: none; }
  .groupe-ajout summary span { margin-left: auto; margin-right: 12px; font-size: 12px; font-weight: 500; color: var(--gris); }
  .groupe-ajout summary::after { content: "+"; font-size: 20px; font-weight: 400; color: var(--gris); width: 16px; text-align: center; }
  .groupe-ajout[open] summary::after { content: "–"; }
  .groupe-ajout .objets { padding-bottom: 14px; }
  .deroule-couleur { padding-bottom: 0; }
  .deroule-couleur[open] { padding-bottom: 14px; }
  .deroule-couleur summary span { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .deroule-couleur summary b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .deroule-couleur .mini { width: 20px; height: 20px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--sable); background-size: cover; }
  .choix { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; cursor: pointer; }
  .choix:hover { border-color: var(--sable); }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--encre); color: #fff; padding: 11px 18px; border-radius: 99px; z-index: 80; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .connexion { max-width: 380px; margin: 10vh auto 0; }
  .connexion img { height: 40px; margin-bottom: 26px; }

  /* 3D */
  .sim { position: relative; background: #e9e4dc; border-radius: 16px; overflow: hidden; height: 58vh; min-height: 340px; touch-action: none; }
  .sim canvas { display: block; width: 100%; height: 100%; }
  .sim .tournage { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(20,19,18,.8); color: #fff; border-radius: 99px; padding: 8px 16px; font-size: 13px; font-weight: 600; pointer-events: none; }
  .sim .aide3d { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.85); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: var(--gris); pointer-events: none; }
  .palette { display: flex; gap: 8px; flex-wrap: wrap; }
  .pastille { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--sable); cursor: pointer; background-size: cover; }
  .pastille.actif { box-shadow: 0 0 0 2px var(--encre); }
  .objets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .objets button { background: #fff; border: 1px solid var(--sable); border-radius: 12px; padding: 10px 6px; font-size: 13px; cursor: pointer; }

  @media (min-width: 900px) {
    body { padding-bottom: 0; padding-left: 230px; }
    nav.bas { top: 0; right: auto; width: 230px; grid-template-columns: 1fr; align-content: start; padding: 90px 14px 0; border-top: 0; border-right: 1px solid rgba(0,0,0,.08); background: #fff; }
    nav.bas a { flex-direction: row; gap: 12px; font-size: 15px; padding: 11px 14px; border-radius: 12px; color: var(--gris); }
    nav.bas a.actif { background: var(--pierre); color: var(--encre); }
    .compte-nav { position: static; margin-left: auto; }
    .haut { margin-left: -230px; padding-left: 230px; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .raccourcis { grid-template-columns: repeat(4, 1fr); }
    .barre-total { bottom: 16px; }
    .voile { align-items: center; }
    .fenetre { border-radius: 20px; }
    .toast { bottom: 30px; }
    .deux-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

</head>
<body>
<header class="haut"><div class="in"><a href="#/accueil"><img src="../medias/logo.png" alt="KA Rénovation"></a><span id="etat"></span></div></header>
<main id="vue"><p class="gris">Chargement…</p></main>
<nav class="bas" id="nav" hidden>
  <a href="#/accueil" data-r="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#/documents/devis" data-r="documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Devis</a>
  <a href="#/demandes" data-r="demandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg>Demandes</a>
  <a href="#/clients" data-r="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Clients</a>
  <a href="#/prestations" data-r="prestations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Prestations</a>
  <a href="#/plus" data-r="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>Plus</a>
</nav>
<script type="module" src="app.js"></script>
</body>
