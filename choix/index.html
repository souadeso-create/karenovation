<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vos choix · KA Rénovation</title>
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fond: #f7f4ef; --pierre: #ebe5dc; --sable: #d9d0c3; --encre: #1b1a18; --gris: #6d675f; --clair: #a39b90; --filet: #c8141a; --ok: #2f6f4f;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--fond); color: var(--encre); line-height: 1.55; font-size: 15px; }
  header { border-bottom: 1px solid rgba(0,0,0,.06); background: #fff; }
  header .in, main { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .in { height: 62px; display: flex; align-items: center; justify-content: space-between; }
  header img { height: 30px; }
  header a { font-size: 14px; color: var(--gris); text-decoration: none; }
  main { padding-top: 30px; padding-bottom: 60px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin-bottom: 12px; }
  .label { display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); margin-bottom: 14px; }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--filet); }
  .gris { color: var(--gris); }
  .carte { background: #fff; border-radius: 16px; padding: 18px; margin-top: 18px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.04); }
  .infos { display: grid; gap: 14px; }
  .infos b { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); font-weight: 600; margin-bottom: 2px; }
  .lot h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--sable); margin-bottom: 4px; }
  .ligne { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--pierre); }
  .ligne small { display: block; color: var(--gris); }
  .ligne .m { white-space: nowrap; font-weight: 500; }
  .lot + .lot { margin-top: 18px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
  .total b { font-family: var(--serif); font-weight: 400; font-size: 30px; }
  .conditions { font-size: 13px; color: var(--gris); white-space: pre-line; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 500 15px var(--sans); padding: 15px 24px; border-radius: 999px; border: 1px solid var(--encre); background: var(--encre); color: #fff; cursor: pointer; text-decoration: none; }
  .btn.clair { background: transparent; color: var(--encre); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  form label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin: 14px 0 6px; }
  form input[type=text] { width: 100%; font: 16px var(--sans); padding: 14px 16px; border: 1px solid var(--sable); border-radius: 12px; background: var(--fond); }
  .case { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--encre); }
  .case input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--encre); }
  .signe { background: #e3f0e8; color: var(--ok); }
  .signe b { font-family: var(--serif); font-weight: 400; font-size: 24px; display: block; }
  .vide { text-align: center; padding: 60px 10px; color: var(--gris); }
  .erreur { color: #a3261f; margin-top: 10px; font-size: 14px; }
  footer { font-size: 12px; color: var(--clair); text-align: center; padding: 0 16px 30px; }
  @media (min-width: 700px) { .infos { grid-template-columns: repeat(3, 1fr); } }
  .apercu { width: 100%; display: block; border-radius: 12px; background: var(--pierre); }
  .choix { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--pierre); }
  .choix:last-child { border-bottom: 0; }
  .magasins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .magasins a { font-size: 12px; color: var(--encre); text-decoration: none; border: 1px solid var(--sable); border-radius: 999px; padding: 5px 11px; background: #fff; }
  .magasins a:hover { border-color: var(--encre); }
  .choix i { width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--sable); }
  .choix small { display: block; color: var(--gris); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<header><div class="in"><a href="../"><img src="../medias/logo.png" alt="KA Rénovation"></a><a href="tel:+33763147627">07 63 14 76 27</a></div></header>
<main id="vue"><p class="vide">Chargement de votre projet…</p></main>
<footer>KA Rénovation · 07 63 14 76 27</footer>

<script type="module">
  const BASE = "https://bafrmnkorenfavwnvsyh.supabase.co", CLE = "sb_publishable_FBsYL_tD0y-F-2Bt-7KZzg_Z4UIpXpK";
  const MAIL = "https://formsubmit.co/ajax/karenovation@outlook.fr";
  const vue = document.getElementById("vue");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const jeton = new URLSearchParams(location.search).get("c") || "";
  const rpc = (f, corps) => fetch(`${BASE}/rest/v1/rpc/${f}`, {
    method: "POST", headers: { apikey: CLE, Authorization: "Bearer " + CLE, "Content-Type": "application/json" }, body: JSON.stringify(corps)
  }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));

  // Magasins proposés au client pour chaque article à acheter.
  // Affiliation : tant qu'un identifiant est vide, le lien reste un lien normal vers la recherche du magasin.
  // awin = identifiant éditeur Awin ; mid = identifiant du programme du magasin sur Awin.
  const AFFIL = { awin: "", mid: { "Leroy Merlin": "", "Castorama": "", "Brico Dépôt": "", "ManoMano": "", "Point.P": "", "Mr.Bricolage": "", "Bricomarché": "" } };
  const MAGASINS = [["Leroy Merlin", q => `https://www.leroymerlin.fr/search?q=${q}`], ["Castorama", q => `https://www.castorama.fr/search?term=${q}`],
    ["Brico Dépôt", q => `https://www.bricodepot.fr/search?search-term=${q}`], ["ManoMano", q => `https://www.manomano.fr/recherche/${q}`],
    ["Point.P", q => `https://www.pointp.fr/search?q=${q}`], ["Mr.Bricolage", q => `https://www.mr-bricolage.fr/catalogsearch/result/?q=${q}`],
    ["Bricomarché", q => `https://www.bricomarche.com/search?q=${q}`]];
  const affilie = nom => !!(AFFIL.awin && AFFIL.mid[nom]);
  const lien = (nom, url) => affilie(nom)
    ? `https://www.awin1.com/cread.php?awinmid=${AFFIL.mid[nom]}&awinaffid=${AFFIL.awin}&ued=${encodeURIComponent(url)}` : url;
  function magasins(terme) {
    const t = encodeURIComponent(terme.replace(/×/g, "x").replace(/[()]/g, "").replace(/ +/g, " ").trim());
    return `<div class="magasins">${MAGASINS.map(([nom, url]) =>
      `<a href="${esc(lien(nom, url(t)))}" target="_blank" rel="${affilie(nom) ? "sponsored " : ""}noopener">${esc(nom)}</a>`).join("")}</div>`;
  }

  let s;
  function afficher() {
    const choix = Array.isArray(s.choix) ? s.choix : [], achats = Array.isArray(s.achats) ? s.achats : [];
    vue.innerHTML = `
      <span class="label">Votre projet</span>
      <h1>${esc(s.nom || "Votre salle de bain")}</h1>
      ${s.image ? `<div class="carte"><img class="apercu" src="${esc(s.image)}" alt="Simulation 3D de votre future salle de bain"><p class="gris" style="font-size:13px;margin-top:8px">Simulation 3D : les couleurs et les proportions sont indicatives.</p></div>` : ""}
      <div class="carte"><h2>Vos choix</h2>
        ${choix.map(c => `<div class="choix">${c.couleur ? `<i style="background:${esc(c.couleur)}"></i>` : ""}<div><small>${esc(c.titre)}</small>${esc(c.valeur)}</div></div>`).join("")}
      </div>
      ${achats.length ? `<div class="carte"><h2>Ce que vous achetez</h2>
        ${achats.map(a => `<div class="ligne"><div>${esc(a.titre)}<small>${esc(a.valeur)}${a.detail ? " · " + esc(a.detail) : ""}</small>${magasins(`${a.titre} ${a.valeur || ""}`)}</div>${a.quantite ? `<div class="m">${esc(a.quantite)}</div>` : ""}</div>`).join("")}
        <p class="gris" style="font-size:13px;margin-top:10px">Colles, joints, produits d'étanchéité et de pose : fournis par KA Rénovation.</p></div>` : ""}
      ${zoneValidation()}`;
    const f = document.getElementById("valider");
    if (f) {
      const ok = () => { f.querySelector("button").disabled = !(f.nom.value.trim().length >= 2 && f.accord.checked); };
      f.oninput = ok; f.onchange = ok; ok();
      f.onsubmit = async e => {
        e.preventDefault();
        const b = f.querySelector("button"); b.disabled = true; b.textContent = "Validation…";
        try {
          const r = await rpc("valider_choix", { j: jeton, nom: f.nom.value.trim() });
          if (!r.ok) throw new Error("deja");
          fetch(MAIL, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ _subject: `Choix validés : ${s.nom || "simulation"}`, _template: "table", _captcha: "false",
              Projet: s.nom || "", Client: s.client || "", "Validé par": f.nom.value.trim(),
              Choix: choix.map(c => `${c.titre} : ${c.valeur}`).join(" · ") }) }).catch(() => {});
          await charger();
          window.scrollTo({ top: document.getElementById("zone-validation").offsetTop - 20, behavior: "smooth" });
        } catch (er) {
          b.textContent = "Je valide mes choix"; b.disabled = false;
          document.getElementById("err").textContent = "La validation n'a pas abouti. Réessayez, ou appelez-nous au 07 63 14 76 27.";
        }
      };
    }
  }

  function zoneValidation() {
    if (s.valide_le) {
      const q = new Date(s.valide_le);
      return `<div class="carte signe" id="zone-validation"><b>✓ Choix validés</b>Le ${q.toLocaleDateString("fr-FR", { dateStyle: "long" })} à ${q.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} par ${esc(s.valide_nom)}. Merci ! Vous pouvez acheter vos matériaux avec la liste ci-dessus.</div>`;
    }
    return `<form class="carte" id="valider">
      <h2 id="zone-validation">Je valide mes choix</h2>
      <p class="gris" style="font-size:14px">Un détail ne vous convient pas ? Appelez-nous avant de valider : nous modifions la simulation.</p>
      <label for="nom">Votre nom et prénom</label>
      <input type="text" id="nom" name="nom" autocomplete="name" maxlength="120" required>
      <label class="case"><input type="checkbox" name="accord">Je confirme les choix ci-dessus pour mon chantier.</label>
      <div class="actions"><button class="btn" type="submit">Je valide mes choix</button></div>
      <p class="erreur" id="err"></p>
    </form>`;
  }

  async function charger() {
    const r = await rpc("choix_public", { j: jeton });
    if (!r || !r.choix) throw new Error("introuvable");
    s = r; afficher();
  }

  if (!/^[0-9a-f-]{36}$/i.test(jeton)) vue.innerHTML = '<p class="vide">Ce lien est incomplet. Vérifiez le message reçu, ou appelez-nous au 07 63 14 76 27.</p>';
  else charger().catch(() => { vue.innerHTML = '<p class="vide">Ce projet est introuvable. Vérifiez le lien reçu, ou appelez-nous au 07 63 14 76 27.</p>'; });
</script>
</body>
</html>
