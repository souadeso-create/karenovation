<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Votre devis · KA Rénovation</title>
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fond: #f7f4ef; --pierre: #ebe5dc; --sable: #d9d0c3; --encre: #1b1a18; --gris: #6d675f; --clair: #a39b90; --filet: #c8141a; --ok: #2f6f4f;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--fond); color: var(--encre); line-height: 1.55; font-size: 15px; }
  header { border-bottom: 1px solid rgba(0,0,0,.06); background: #fff; }
  header .in, main { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .in { height: 62px; display: flex; align-items: center; justify-content: space-between; }
  header img { height: 30px; }
  header a { font-size: 14px; color: var(--gris); text-decoration: none; }
  main { padding-top: 30px; padding-bottom: 60px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin-bottom: 12px; }
  .label { display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); margin-bottom: 14px; }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--filet); }
  .gris { color: var(--gris); }
  .carte { background: #fff; border-radius: 16px; padding: 18px; margin-top: 18px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.04); }
  .infos { display: grid; gap: 14px; }
  .infos b { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); font-weight: 600; margin-bottom: 2px; }
  .lot h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--sable); margin-bottom: 4px; }
  .ligne { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--pierre); }
  .ligne small { display: block; color: var(--gris); }
  .ligne .m { white-space: nowrap; font-weight: 500; }
  .lot + .lot { margin-top: 18px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
  .total b { font-family: var(--serif); font-weight: 400; font-size: 30px; }
  .conditions { font-size: 13px; color: var(--gris); white-space: pre-line; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 500 15px var(--sans); padding: 15px 24px; border-radius: 999px; border: 1px solid var(--encre); background: var(--encre); color: #fff; cursor: pointer; text-decoration: none; }
  .btn.clair { background: transparent; color: var(--encre); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  form label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin: 14px 0 6px; }
  form input[type=text] { width: 100%; font: 16px var(--sans); padding: 14px 16px; border: 1px solid var(--sable); border-radius: 12px; background: var(--fond); }
  .case { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--encre); }
  .case input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--encre); }
  .signe { background: #e3f0e8; color: var(--ok); }
  .signe b { font-family: var(--serif); font-weight: 400; font-size: 24px; display: block; }
  .vide { text-align: center; padding: 60px 10px; color: var(--gris); }
  .erreur { color: #a3261f; margin-top: 10px; font-size: 14px; }
  footer { font-size: 12px; color: var(--clair); text-align: center; padding: 0 16px 30px; }
  @media (min-width: 700px) { .infos { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header><div class="in"><a href="../"><img src="../medias/logo.png" alt="KA Rénovation"></a><a href="tel:+33763147627">07 63 14 76 27</a></div></header>
<main id="vue"><p class="vide">Chargement de votre devis…</p></main>
<footer id="pied"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module">
  import { telechargerPDF, totaux, eur } from "../admin/pdf.js";
  const BASE = "https://bafrmnkorenfavwnvsyh.supabase.co", CLE = "sb_publishable_FBsYL_tD0y-F-2Bt-7KZzg_Z4UIpXpK";
  const MAIL = "https://formsubmit.co/ajax/karenovation@outlook.fr";
  const vue = document.getElementById("vue");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dateFr = d => d ? new Date(String(d).length === 10 ? d + "T12:00:00" : d).toLocaleDateString("fr-FR", { dateStyle: "long" }) : "";
  const jeton = new URLSearchParams(location.search).get("d") || "";
  const rpc = (f, corps) => fetch(`${BASE}/rest/v1/rpc/${f}`, {
    method: "POST", headers: { apikey: CLE, Authorization: "Bearer " + CLE, "Content-Type": "application/json" }, body: JSON.stringify(corps)
  }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));

  let d, p;
  function afficher() {
    const t = totaux(d), c = d.client || {};
    const nom = [c.civilite, c.nom, c.prenom].filter(Boolean).join(" ");
    vue.innerHTML = `
      <span class="label">Devis n° ${esc(d.numero)}</span>
      <h1>${esc(d.objet || "Votre devis")}</h1>
      <div class="carte infos">
        <div><b>Client</b>${esc(nom)}${c.adresse ? `<br><span class="gris">${esc([c.adresse, [c.cp, c.ville].filter(Boolean).join(" ")].filter(Boolean).join(", "))}</span>` : ""}</div>
        <div><b>Date du devis</b>${dateFr(d.date)}${p.validite_jours ? `<br><span class="gris">Valable ${esc(p.validite_jours)} jours</span>` : ""}</div>
        <div><b>Travaux</b>${d.date_debut ? "À partir du " + dateFr(d.date_debut) : "Date à convenir"}${d.duree ? `<br><span class="gris">Durée : ${esc(d.duree)}</span>` : ""}</div>
      </div>
      <div class="carte">
        ${(d.sections || []).filter(s => s.lignes?.length).map(s => `<div class="lot"><h3>${esc(s.titre)}</h3>
          ${s.lignes.map(l => `<div class="ligne"><div>${esc(l.designation).replace(/\n/g, "<br>")}<small>${esc(l.qte)} ${esc(l.unite || "")} × ${eur(l.pu)} €</small></div><div class="m">${eur((Number(l.qte) || 0) * (Number(l.pu) || 0))} €</div></div>`).join("")}</div>`).join("")}
        <div class="total"><span>Net à payer</span><b>${eur(t.ht)} €</b></div>
        <p class="gris" style="font-size:13px;margin-top:4px">${esc(p.mention_tva || "")}${t.acompte ? ` · Acompte à la signature : ${eur(t.acompte)} € (${esc(d.acompte_pct)} %)` : ""}</p>
        <div class="actions"><button class="btn clair" id="pdf">Télécharger le PDF</button></div>
      </div>
      ${d.notes ? `<div class="carte"><h2>Note</h2><p style="white-space:pre-line">${esc(d.notes)}</p></div>` : ""}
      ${zoneSignature()}
      ${p.conditions ? `<div class="carte"><h2>Conditions générales</h2><p class="conditions">${esc(p.conditions)}</p></div>` : ""}`;
    document.getElementById("pdf").onclick = () => telechargerPDF(d, p).catch(e => alert("Le PDF n'a pas pu être créé."));
    const f = document.getElementById("signer");
    if (f) {
      const ok = () => { f.querySelector("button").disabled = !(f.nom.value.trim().length >= 2 && f.accord.checked); };
      f.oninput = ok; f.onchange = ok; ok();
      f.onsubmit = async e => {
        e.preventDefault();
        const b = f.querySelector("button"); b.disabled = true; b.textContent = "Signature…";
        try {
          const r = await rpc("signer_devis", { j: jeton, nom: f.nom.value.trim() });
          if (!r.ok) throw new Error("deja");
          fetch(MAIL, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ _subject: `Devis ${d.numero} signé en ligne`, _template: "table", _captcha: "false",
              Devis: d.numero, Client: nom, "Signé par": f.nom.value.trim(), Montant: `${eur(t.ht)} €` }) }).catch(() => {});
          await charger();
          window.scrollTo({ top: document.getElementById("zone-signature").offsetTop - 20, behavior: "smooth" });
        } catch (er) {
          b.textContent = "Signer le devis"; b.disabled = false;
          document.getElementById("err").textContent = "La signature n'a pas abouti. Réessayez, ou appelez-nous au 07 63 14 76 27.";
        }
      };
    }
  }

  function zoneSignature() {
    const t = totaux(d);
    if (d.signe_le) {
      const q = new Date(d.signe_le);
      return `<div class="carte signe" id="zone-signature"><b>✓ Devis signé</b>Bon pour accord donné le ${q.toLocaleDateString("fr-FR", { dateStyle: "long" })} à ${q.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} par ${esc(d.signe_nom)}. Merci de votre confiance, nous vous recontactons pour organiser le chantier.</div>`;
    }
    if (d.statut === "refuse") return `<div class="carte" id="zone-signature"><p class="gris">Ce devis n'est plus à signer. Pour toute question : 07 63 14 76 27.</p></div>`;
    return `<form class="carte" id="signer">
      <h2 id="zone-signature">Bon pour accord</h2>
      <p class="gris" style="font-size:14px">Reçu avant l'exécution des travaux, bon pour accord pour un net à payer de <b style="color:var(--encre)">${eur(t.ht)} €</b>.</p>
      <label for="nom">Votre nom et prénom</label>
      <input type="text" id="nom" name="nom" autocomplete="name" maxlength="120" required>
      <label class="case"><input type="checkbox" name="accord">J'ai lu le devis et les conditions générales ci-dessous, et je les accepte.</label>
      <div class="actions"><button class="btn" type="submit">Signer le devis</button></div>
      <p class="erreur" id="err"></p>
    </form>`;
  }

  async function charger() {
    const r = await rpc("devis_public", { j: jeton });
    if (!r || !r.doc) throw new Error("introuvable");
    d = r.doc; p = r.p || {};
    document.getElementById("pied").textContent = [p.entreprise, p.forme, p.siret ? "SIRET " + p.siret : ""].filter(Boolean).join(" · ");
    afficher();
  }

  if (!/^[0-9a-f-]{36}$/i.test(jeton)) vue.innerHTML = '<p class="vide">Ce lien de devis est incomplet. Vérifiez le message reçu, ou appelez-nous au 07 63 14 76 27.</p>';
  else charger().catch(() => { vue.innerHTML = '<p class="vide">Ce devis est introuvable. Vérifiez le lien reçu, ou appelez-nous au 07 63 14 76 27.</p>'; });
</script>
</body>
</html>
